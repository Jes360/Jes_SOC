name: JestineSOC Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting & Sigma Tools
        run: |
          python -m pip install --upgrade pip
          pip install yamllint pyyaml sigma-cli pySigma

      - name: Validate YAML Syntax
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 180}}}" .

      - name: Validate Sigma Rules & Correlations
        run: |
          echo "Checking for atomic Sigma rules in detections/sigma/..."
          if ls detections/sigma/*.yml 1> /dev/null 2>&1; then
            echo "Validating atomic Sigma rules with sigma-cli..."
            sigma check detections/sigma/
          else
            echo "[Phase Note] detections/sigma/ contains no .yml files yet (Phase 1 Baseline). Skipping until Phase 2."
          fi
          echo "Checking for correlation rules in correlations/..."
          python -c "
          import yaml, glob
          rules = glob.glob('correlations/*.yml')
          if rules:
              for f in rules:
                  with open(f, 'r') as stream:
                      data = yaml.safe_load(stream)
                      assert 'correlation' in data, f'Missing correlation block in {f}'
                      print(f'Validated correlation structure: {f}')
          else:
              print('[Phase Note] correlations/ contains no .yml files yet. Skipping until Phase 2.')
          "

      - name: PowerShell Script Syntax Validation
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Recurse -Filter *.ps1
          foreach ($s in $scripts) {
              Write-Host "Parsing: $($s.FullName)"
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$errors)
              if ($errors.Count -gt 0) {
                  Write-Error "Syntax error in: $($s.FullName)"
                  exit 1
              }
          }
          Write-Host "All PowerShell scripts parsed with 0 syntax errors."

      - name: Secret Leakage Scan (NFR-02 - TruffleHog OSS)
        uses: trufflesecurity/trufflehog@4b7d1d3a6827691637eff750b6482042e06462d0 # pinned immutable commit SHA
        with:
          extra_args: --only-verified=false


      - name: Evidence Sanitization Scan (NFR-03)
        run: |
          echo "Scanning evidence directory for un-sanitized RFC1918 IPs, real hostnames, or personal data..."
          python -c "
          import os, re
          # Enforce RFC 5737 documentation ranges or loopback only in evidence files
          # Flag RFC 1918 private subnets if accidentally committed
          rfc1918_patterns = [
              r'\b10\.\d{1,3}\.\d{1,3}\.\d{1,3}\b',
              r'\b172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}\b',
              r'\b192\.168\.\d{1,3}\.\d{1,3}\b'
          ]
          evidence_dir = 'evidence'
          if os.path.exists(evidence_dir):
              for root, _, files in os.walk(evidence_dir):
                  for f in files:
                      if f == '.gitkeep': continue
                      path = os.path.join(root, f)
                      with open(path, 'r', errors='ignore') as content:
                          text = content.read()
                          for pat in rfc1918_patterns:
                              matches = re.findall(pat, text)
                              if matches:
                                  raise ValueError(f'Un-sanitized RFC1918 IP {matches[0]} found in {path}. Use RFC 5737 documentation IPs (192.0.2.x, 198.51.100.x, 203.0.113.x) or loopback.')
          print('Sanitization check passed: evidence directory conforms to NFR-03.')
          "

